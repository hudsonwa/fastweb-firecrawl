[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fastweb-firecrawl"
dynamic = ["version"]
description = "Fast self-hosted search and scrape server that speaks Firecrawl's /v1 and /v2 API (SearXNG, tiered fetch, SSRF-guarded headless Chrome)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Hudson" }]
requires-python = ">=3.12"
keywords = ["firecrawl", "searxng", "scraper", "web-scraping", "ai-agents", "self-hosted", "web-search", "llm-tools",
            "headless-chrome", "starlette"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# Compatible ranges; requirements.txt pins the exact versions the Docker image and CI install.
dependencies = [
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "httpx[http2]>=0.28,<0.29",
    "trafilatura>=2.3,<3",
    "pypdf>=6.21,<7",
    "selectolax>=1.0.2,<2",
    "markdownify>=1.2,<2",
    "redis>=8.1,<9",
    "charset-normalizer>=3.5,<4",
    "curl_cffi>=0.17,<0.18",
    "websockets>=17.3,<18",
]

[project.scripts]
fastweb-firecrawl = "fastweb_firecrawl.app:main"
fastweb-firecrawl-egress = "fastweb_firecrawl.egress:cli"

[project.urls]
Homepage = "https://github.com/hudsonwa/fastweb-firecrawl"
Issues = "https://github.com/hudsonwa/fastweb-firecrawl/issues"
Changelog = "https://github.com/hudsonwa/fastweb-firecrawl/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "fastweb_firecrawl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fastweb_firecrawl"]

[tool.hatch.build.targets.sdist]
include = ["/fastweb_firecrawl", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/THIRD_PARTY_LICENSES.md",
           "/requirements.txt", "/requirements-dev.txt",
           "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/examples", "/bench",
           # read by the tests: compose and SearXNG config, the images they describe
           "/docker-compose.yml", "/Dockerfile", "/.env.example", "/searxng", "/browser", "/scripts"]
exclude = ["__pycache__", "*.pyc", "/bench/out"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PLE", "PLW", "PLR0911", "PLR0912", "PLR0915"]
# RUF001/RUF003: en dashes, "×" and non-ASCII test fixtures are intended.
# PLW2901: rebinding a loop variable to its normalised form is used deliberately in parsers.
ignore = ["RUF001", "RUF003", "PLW2901"]

[tool.ruff.lint.pylint]
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# Tests and the bench carry long HTML and search fixtures (E501). pytest fixtures are shared by importing them
# into the test module; tests unpack fixtures they do not all use, and fake servers catch broadly.
"tests/*" = ["E501", "F401", "F811", "RUF059", "BLE001", "B904", "PLR0911", "PLR0912", "PLR0915", "PLW2901", "RUF005",
             "PLW0603", "PLW1510", "SIM115", "RUF006", "RUF012", "PLW0108", "UP031", "RUF015"]
"bench/*" = ["E501", "BLE001", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
packages = ["fastweb_firecrawl"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
# Parallel by default (pytest-xdist); the slow tests (several seconds of real timing each) are opt-in locally:
# `pytest -m ""` runs everything, as CI does.
addopts = ["-n", "auto", "--dist", "loadgroup", "-m", "not slow", "--strict-markers"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "browser: needs a real chromedp/headless-shell (set FASTWEB_TEST_CDP)",
    "slow: takes several seconds of real time; deselected by default, run with -m \"\"",
]

[[tool.mypy.overrides]]
# selectolax's stubs make every node lookup Optional; extraction checks for None where it matters.
module = ["fastweb_firecrawl.extract"]
disable_error_code = ["union-attr", "assignment", "misc"]
